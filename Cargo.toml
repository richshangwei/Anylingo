[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/floatrans-core",
  "crates/floatrans-capture",
  "crates/floatrans-providers",
  "crates/floatrans-storage"
]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "MIT"
authors = ["Floatrans contributors"]

[workspace.dependencies]
async-trait = "0.1.91"
futures-util = "0.3.33"
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
